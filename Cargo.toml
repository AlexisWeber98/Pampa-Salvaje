[workspace]
resolver = "3"
members = ["crates/core", "crates/content", "crates/render", "game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pampa-core = { path = "crates/core" }
pampa-render = { path = "crates/render" }
pampa-content = { path = "crates/content" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
# Lean Bevy: only what the slice needs (3D PBR, windowing, keyboard and mouse input,
# UI image nodes for the minimap; no default font: lettering is our own bitmap font).
# glTF scenes for third-party models, with the PNG/JPEG decoders their PBR textures use;
# spawning a scene copies its components by reflection, so derived types self-register.
# Skeletal animation plays the glTF clips of the animated fauna (Quaternius cattle and horses);
# `gltf_animation` has the glTF loader read those clips and give scenes their animation players.
# Building textures ship as UASTC KTX2 (zstd-supercompressed, mips baked offline by
# tools/textures_to_ktx2.sh), transcoded at load to the GPU's block format (BC7 here).
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "wayland",
    "x11",
    "keyboard",
    "mouse",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_color",
    "bevy_mesh",
    "bevy_image",
    "bevy_ui",
    "bevy_ui_render",
    "tonemapping_luts",
    "zstd_rust",
    "ktx2",
    "basis-universal",
    "bevy_gltf",
    "bevy_animation",
    "gltf_animation",
    "png",
    "jpeg",
    "reflect_auto_register",
] }

# Bevy is slow in pure debug builds; optimize dependencies, keep our code debuggable.
# Our crates keep line tables only (enough for backtraces with file:line), and
# dependencies carry no debug info at all: full debug info made the binary
# ~1.6 GB and every relink slow. Split debug info keeps it out of the link.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The shipped game: link-time optimization across all crates and a single
# codegen unit let LLVM drop unused Bevy code, and `strip = true` removes both
# debug info and the symbol table (149 MB -> 68 MB on 2026-10-23). Crash
# backtraces then show no function names; `strip = "debuginfo"` keeps them
# for ~31 MB more, worth it for tester builds later. Dev builds keep full
# backtraces either way.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
